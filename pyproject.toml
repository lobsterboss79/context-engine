[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "context-engine"
version = "0.1.0"
description = "Governed task-specific context assembly."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "markdown-it-py>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[project.scripts]
context-engine = "context_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.setuptools.packages.find]
where = ["src"]
